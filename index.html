<title>CS Season Драфт</title>
<meta name="description" content="CS all-time draft: build a team, ban maps, play a 200-match season.">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#05070d;--card:#0c1220;--ink:#fff;--mute:#8b94a7;--line:#2a2f3d;--acc:#ff7a1f;--acc2:#4cc9a6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{margin:0;font-size:34px;letter-spacing:.5px}
.sub{color:var(--mute);margin:2px 0 14px;font-size:16px}
.slots{display:flex;gap:6px;margin-bottom:14px}
.slot{flex:1;border:2px solid var(--line);border-radius:6px;padding:6px 2px;text-align:center;font-size:14px;color:var(--mute);min-height:46px}
.slot.on{border-color:var(--acc);color:var(--ink)}
.slot b{display:block;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q{font-size:22px;margin:4px 0 10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt:active,.opt:focus-visible{border-color:var(--acc);outline:none}
.nm{font-size:26px;font-weight:700}
.tm{color:var(--mute);font-size:15px}
.st{display:flex;gap:18px;margin-top:6px}
.st span{font-size:20px;font-weight:700}.st small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.big{font-size:84px;font-weight:800;line-height:1;margin:6px 0;color:var(--acc)}
.grade{font-size:22px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.row i{font-style:normal;color:var(--mute)}
.btn{font:inherit;font-size:20px;font-weight:700;border:0;border-radius:6px;padding:12px 16px;cursor:pointer;background:var(--acc);color:#fff;margin:12px 8px 0 0}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.txt{color:var(--mute);margin:10px 0;line-height:1.35}
.scroll{overflow-x:auto}
body{background:radial-gradient(ellipse at 50% 0,#1c2238,var(--bg) 60%) no-repeat var(--bg)}
h1,.nm,.big,.btn{font-style:italic;text-transform:uppercase}
h1{color:var(--acc)}
.opt{border-left:4px solid var(--acc);background:linear-gradient(90deg,#1a1410,var(--card))}
.slot.on{box-shadow:0 0 12px #ff7a1f55}
.btn{box-shadow:0 0 14px #ff7a1f44}.btn.alt{box-shadow:none}
.row i{font-size:13px;text-align:right;margin-left:10px}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}.lb{font:inherit;font-size:15px;font-weight:700;background:transparent;color:var(--mute);border:2px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer}.lb.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.opt{transition:border-color .15s,transform .15s}.opt:hover{border-color:var(--acc)}.opt:active{transform:scale(.99)}
.slot.done{border-color:#4cc9a655}.slot.done b{color:var(--acc2)}
.bar{display:flex;gap:2px;margin:6px 0 12px}.tile{flex:1;height:10px;border-radius:2px;transform-origin:bottom;animation:pop .22s both}
@keyframes pop{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.grade.g0,.big.gold{color:#ffc83d}.grade.g4{color:var(--mute)}.big.gold{text-shadow:0 0 24px #ffc83d88}
.btn:focus-visible,.lb:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dim{display:grid;grid-template-columns:130px 1fr 30px;gap:8px;align-items:center;font-size:15px;color:var(--mute);margin:4px 0}.dim div{height:8px;background:var(--line);border-radius:4px}.dim i{display:block;height:100%;background:var(--acc);border-radius:4px}.dim b{color:var(--ink);text-align:right}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:0 6px 6px 0;font-size:15px;color:var(--mute)}.chip.good{color:var(--acc2);border-color:var(--acc2)}
.opt.r-l{border-left-color:#ffc83d;background:linear-gradient(90deg,#2a2008,var(--card));box-shadow:0 0 14px #ffc83d33}.opt.r-l .st span:first-child{color:#ffc83d}
.opt.r-e{border-left-color:#b983ff;background:linear-gradient(90deg,#1c1230,var(--card))}
.opt.r-r{border-left-color:#4aa3ff;background:linear-gradient(90deg,#0d1a2c,var(--card))}
.opt.r-c{border-left-color:#4a5368;background:var(--card)}
.rb{font-size:12px;padding:1px 6px;border-radius:4px;margin-left:6px;text-transform:uppercase;letter-spacing:.5px;border:1px solid currentColor}
.rb.r-l{color:#ffc83d}.rb.r-e{color:#b983ff}.rb.r-r{color:#4aa3ff}.rb.r-c{color:var(--mute)}
.bud{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-size:18px}.bud div{flex:1;height:8px;background:var(--line);border-radius:4px}.bud i{display:block;height:100%;background:#ffc83d;border-radius:4px}
.opt.off{opacity:.38;cursor:not-allowed}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.mg .opt{margin:0;padding:10px;font-size:20px}.mg .opt b{float:right;color:var(--acc)}
.okc{color:var(--acc2);font-style:normal;font-weight:700}.noc{color:#e5645a;font-style:normal;font-weight:700}
.bar{gap:0}.tile{min-width:1px}
.big{font-size:min(72px,16vw);white-space:nowrap}
.row i.okc,.row i.noc{font-size:22px}.row i.okc{color:var(--acc2)}.row i.noc{color:#e5645a}
.bud{flex-wrap:wrap}.bud span{flex:1 1 100%}.bud div{flex:1 1 100%}
.mg .opt{font-size:18px}.mg .opt small{color:var(--mute);font-size:12px;margin-left:4px}
details{margin-top:6px}summary{cursor:pointer;font-size:20px;padding:10px 0;border-bottom:1px solid var(--line);list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"▸ ";color:var(--acc)}details[open]>summary::before{content:"▾ "}
.btn:focus-visible,.lb:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>

function chem(){

  for(var i=0;i<5;i++)for(var j=i+1;j<5;j++){var d=Math.abs(picks[i][2]-picks[j][2]);if(d<=2&&tm(picks[i][1])===tm(picks[j][1])){c+=40-10*d;pairs.push([picks[i][0],picks[j][0],tm(picks[i][1])])}}
  var co=picks[5];for(var k=0;k<5;k++){var e=Math.abs(co[2]-picks[k][2]);if(e<=2&&tm(co[1])===tm(picks[k][1])){c+=30-9*e;pairs.push([co[0],picks[k][0],tm(co[1])])}}
  return {v:Math.min(c*CHM,CAP),pairs:pairs};
}

var LG=[40,38,34,34,34],EVS=["s1","m1","s2","m2","w"];
function season(td,ch){
  var co=picks[5],ev=[],W=0,L=0,rec={},res=[],ti={m:0,w:0,s:0};
  function mp(b,sp){var m=MAPS[Math.floor(Math.random()*7)],perf=0;for(var k=0;k<5;k++)perf+=m[1][k]*td[k];
    var S=1500+(perf-21)*10+ch.v+40+(co[4]-80)*2,opp=b+Math.random()*sp,w=Math.random()<1/(1+Math.pow(10,(opp-S)/400));
    var r=rec[m[0]]=rec[m[0]]||[0,0];if(w)r[0]++;else r[1]++;return w}
  function cnt(w,o){if(w){W++;o.w++}else{L++;o.l++}res.push(w)}
  function bo3(b){var a=0,c=0;while(a<2&&c<2){if(mp(b,350))a++;else c++}return a===2}
  EVS.forEach(function(key,i){
    var o={k:"lg",w:0,l:0};for(var j=0;j<LG[i];j++)cnt(mp(1500,400),o);ev.push(o);
    var b=key[0]==="m"?1620:key==="w"?1660:1560,sw=key[0]==="m"?3:2,x={k:key,w:0,l:0,st:"out"},a=0,c=0;
    while(a<sw&&c<sw){var w=mp(b,350);cnt(w,x);if(w)a++;else c++}
    if(a===sw){x.st="qf";["qf","sf","f"].some(function(rn){var w=bo3(b+60);cnt(w,x);if(!w){x.st=rn;return true}if(rn==="f")x.st="win";return false})}
    if(x.st==="win"){if(key[0]==="m")ti.m++;else if(key==="w")ti.w++;else ti.s++}
    ev.push(x);
  });

function applyTour(){
  var key=EVS[SEAS.i],b=key[0]==="m"?1620:key==="w"?1660:1560,sw=key[0]==="m"?3:2,q=[],a=0,c=0,x={k:key,w:0,l:0,st:"out"};
  function g(bb){var m=pickW(SEAS.mp),S=sStr(m),opp=bb+Math.random()*350,p=1/(1+Math.pow(10,(opp-S)/400)),w=Math.random()<p;recMap(m[0],w);return {m:m[0],w:w,s:scr(w,p)}}

  var ms=MAPS.map(function(m){var r=RS.rec[m[0]]||[0,0];return {n:m[0],w:m[1],r:r,p:r[0]/Math.max(1,r[0]+r[1])}}).sort(function(a,b){return b.p-a.p});
  var bm=ms[0],wm=ms[ms.length-1];
  if(bm.n!==wm.n){o.push(t("maprec",bm.n,bm.r[0]+"-"+bm.r[1],wm.n,wm.r[0]+"-"+wm.r[1]));
    var wi=0,wv=-1e9;for(var q=0;q<5;q++){var v=wm.w[q]*(50-td[q]);if(v>wv){wv=v;wi=q}}
    if(wv>0)o.push(t("mapwhy",wm.n,T[LANG].dims[wi].toLowerCase()))}
  o.push(co[4]>=90?t("cohi",co[0]):t("colo",co[0]));
  return o.join(" ");
}
function extra(){
  var d=RS.td.map(function(v,i){return '<div class="dim"><span>'+T[LANG].dims[i]+'</span><div><i style="width:'+Math.round(v)+'%"></i></div><b>'+Math.round(v)+'</b></div>'}).join("");
  var m='<div class="q" style="font-size:18px;margin-top:12px">'+t("mapsh")+'</div><div>'+MAPS.map(function(x){var r=RS.rec[x[0]]||[0,0];return '<span class="chip'+(r[0]>r[1]?' good':'')+'">'+x[0]+' '+r[0]+'-'+r[1]+'</span>'}).join("")+'</div>';
  return d+m+'<div class="tm" style="margin-top:6px">'+t("est")+'</div>';
}
function showResult(){
  screen="result";
  var W=RS.W,L=RS.L,gi=gradeIdx(RS.pts),g=T[LANG].grades[gi],ti=RS.ti,nT=ti.m+ti.w+ti.s;
  var bar='<div class="bar" role="img" aria-label="'+W+'-'+L+'">'+RS.res.map(function(w,i){return '<span class="tile" style="animation-delay:'+Math.min(i*6,1200)+'ms;background:'+(w?'var(--acc2)':'#5a2a2a')+'"></span>'}).join("")+'</div>';
  var evs=RS.ev.map(function(e){if(e.k==="lg")return '<div class="row"><span>'+t("lg")+'</span><i>'+e.w+'-'+e.l+'</i></div>';
    return '<div class="row"><span>'+(e.st==="win"?'🏆 ':'')+t(e.k)+'</span><i>'+t("st_"+e.st)+' · '+e.w+'-'+e.l+'</i></div>'}).join("");
  var lineup=picks.map(function(p,i){return '<div class="row"><span>'+ROLES[i]+' · <b>'+p[0]+'</b></span><i>'+p[1]+' '+p[2]+' · '+(p[3]==="Coach"?t("tac",p[4]):p[4].toFixed(2))+'</i></div>'}).join("");
  var txt=t("title")+" ("+t(eraKey)+"): "+W+"-"+L+(nT?" 🏆×"+nT:"")+" ("+g+")\n"+picks.map(function(p,i){return ROLES[i]+": "+p[0]+" ("+p[1]+" "+p[2]+")"}).join("\n");
  function det(h,b,o){return '<details'+(o?' open':'')+'><summary>'+h+'</summary>'+b+'</details>'}
  app.innerHTML=head().replace(t("sub"),t("result")+" · "+t(eraKey))+'<div class="big'+(nT>=3?' gold':'')+'">'+W+' - '+L+'</div><div class="grade g'+gi+'">'+g+(nT?' · 🏆×'+nT:'')+'</div>'+bar+
  '<div class="txt">'+t("avg",RS.avg.toFixed(2))+' '+comment()+'</div>'+
  '<button class="btn" id="again">'+t("again")+'</button><button class="btn alt" id="share">'+t("share")+'</button>'+
  det(t("lineup"),lineup,true)+det(t("seasonh"),evs)+det(t("dimsh"),extra())+lbHtml();
  countUp(app.querySelector(".big"),W,W+L);
  document.getElementById("again").onclick=start;
  document.getElementById("share").onclick=function(){var b=this;copyText(txt,function(){b.textContent=t("copied")},function(){b.textContent=t("fail")})};
  bindLang();
}
start();
</script>
